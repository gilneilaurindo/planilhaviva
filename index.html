<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanilhaViva Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-cyan-500 selection:text-slate-900">
    <div class="max-w-md mx-auto bg-slate-900 min-h-screen shadow-2xl relative pb-20">
        
        <div class="bg-gradient-to-r from-blue-950 to-slate-900 p-6 rounded-b-3xl shadow-lg border-b border-slate-800">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-3" id="user-profile">
                    <div id="profile-pic-container" class="w-11 h-11 rounded-full bg-slate-800 border-2 border-cyan-500/50 flex items-center justify-center overflow-hidden shadow-lg shadow-cyan-500/20">
                        <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                    </div>
                    <div>
                        <h1 id="user-name" class="text-sm font-bold text-white tracking-wide">Visitante</h1>
                        <p id="user-email" class="text-[10px] text-slate-400">Inicie sessão para continuar</p>
                    </div>
                </div>

                <button onclick="installPWA()" id="installBtn" class="hidden text-[10px] bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-3 py-1.5 rounded-full font-bold shadow-lg transition transform active:scale-95 uppercase tracking-wider">
                    Instalar App
                </button>
            </div>
            
            <div id="google-login-button" class="mt-5 flex justify-center"></div>
        </div>

        <div class="p-6">
            <div id="app-content" class="bg-slate-800/80 backdrop-blur-md p-5 rounded-2xl border border-slate-700 shadow-xl opacity-40 pointer-events-none transition-all duration-500">
                <h2 class="text-sm font-bold mb-5 text-cyan-400 flex items-center">
                    <i data-lucide="plus-circle" class="mr-2 w-4 h-4"></i> Novo Lançamento
                </h2>
                
                <form id="txForm" class="space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Descrição</label>
                        <input type="text" id="desc" required placeholder="Ex: Conta de Luz" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition-colors placeholder-slate-600 text-white">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Valor (R$)</label>
                            <input type="number" id="amount" step="0.01" required placeholder="0,00" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition-colors text-white">
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Tipo</label>
                            <select id="type" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition-colors text-white appearance-none">
                                <option value="in">Entrada (+)</option>
                                <option value="out">Saída (-)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Categoria</label>
                        <select id="category" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition-colors text-white appearance-none">
                            <option value="Receita">Receita</option>
                            <option value="Dízimo">Dízimo</option>
                            <option value="Fixos">Fixos</option>
                            <option value="Pessoal">Pessoal</option>
                            <option value="Saúde">Saúde</option>
                            <option value="Dívidas">Dívidas</option>
                            <option value="Investimento">Investimento</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Data</label>
                        <input type="date" id="date" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition-colors text-white">
                    </div>
                    
                    <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold py-3.5 rounded-xl transition-all transform active:scale-[0.98] shadow-lg shadow-cyan-500/25 flex justify-center items-center mt-2">
                        <i data-lucide="send" class="mr-2 w-4 h-4"></i> Guardar na Folha
                    </button>
                </form>
            </div>
        </div>

        <div class="fixed bottom-0 w-full max-w-md bg-slate-950/90 backdrop-blur-lg border-t border-slate-800 flex justify-around p-2 pb-4 z-50">
            <button class="flex flex-col items-center p-2 text-cyan-400"><i data-lucide="list-video" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-medium uppercase tracking-wider">Fluxo</span></button>
            <button class="flex flex-col items-center p-2 text-slate-500 hover:text-slate-300 transition-colors"><i data-lucide="pie-chart" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-medium uppercase tracking-wider">Resumo</span></button>
            <button class="flex flex-col items-center p-2 text-slate-500 hover:text-slate-300 transition-colors"><i data-lucide="trending-up" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-medium uppercase tracking-wider">Investir</span></button>
            <button class="flex flex-col items-center p-2 text-slate-500 hover:text-slate-300 transition-colors"><i data-lucide="settings" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-medium uppercase tracking-wider">Config</span></button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // INSIRA O SEU CLIENT ID DO GOOGLE AQUI ABAIXO:
        const GOOGLE_CLIENT_ID = "COLA_AQUI_O_TEU_CLIENT_ID.apps.googleusercontent.com";
        
        // URL DO SEU BACKEND NO GOOGLE APPS SCRIPT (Atualizado)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcqvMLkEdrIpJwZM0EVDadeQJln0zXaxZsov2Y7TFiaRnPrLXN5sCKVpeK5d62n8yrYA/exec";

        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            
            const userFoto = responsePayload.picture;
            const userNome = responsePayload.given_name; 
            const userEmail = responsePayload.email;

            document.getElementById('profile-pic-container').innerHTML = `<img src="${userFoto}" alt="Perfil" class="w-full h-full object-cover">`;
            document.getElementById('user-name').innerText = userNome;
            document.getElementById('user-email').innerText = userEmail;

            document.getElementById('google-login-button').style.display = 'none';
            document.getElementById('app-content').classList.remove('opacity-40', 'pointer-events-none');
            
            sessionStorage.setItem('googleToken', response.credential);
            sessionStorage.setItem('userEmail', userEmail);
        }

        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("google-login-button"),
                { theme: "filled_black", size: "large", type: "standard", shape: "pill", width: "250" }
            );
            
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
        };

        document.getElementById('txForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userEmail = sessionStorage.getItem('userEmail');
            if(!userEmail) {
                alert("Por favor, inicie sessão no Google primeiro.");
                return;
            }

            const btn = e.target.querySelector('button');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader" class="mr-2 w-4 h-4 animate-spin"></i> A guardar...';
            btn.disabled = true;
            lucide.createIcons();

            const data = {
                action: "add_transaction",
                email: userEmail,
                desc: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if(result.status === "success") {
                    alert("✅ Guardado com sucesso na tua folha de cálculo!");
                    e.target.reset();
                    document.getElementById('date').value = new Date().toISOString().split('T')[0];
                } else {
                    alert("Erro no servidor: " + result.message);
                }
            } catch (err) {
                alert("Falha na comunicação. Verifica a tua ligação à internet.");
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
                lucide.createIcons();
            }
        });

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('installBtn').classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }
    </script>
</body>
</html>
