<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Meu App | PlanilhaViva</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/gilneilaurindo/planilhaviva/main/logo.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/gilneilaurindo/planilhaviva/main/logo.png">

<!-- Bibliotecas -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root { color-scheme: dark; }
  body { background-color: #020617; margin: 0; overflow-x: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

  /* EFEITOS GLASSMORPHISM */
  .glass { background: rgba(15,23,42,.7); backdrop-filter: blur(28px); border: 1px solid rgba(56,189,248,.2); box-shadow: 0 25px 50px -12px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,0.05); }
  .glass-neon { border: 1px solid rgba(56,189,248,.5); box-shadow: 0 0 35px rgba(56,189,248,.2), inset 0 0 20px rgba(56,189,248,.1); }
  .glow-blue { position: absolute; width: 250px; height: 250px; border-radius: 9999px; background: rgba(56,189,248,.15); filter: blur(80px); top: -50px; left: -50px; pointer-events: none; }

  /* ANIMAÇÕES */
  .view { display: none; opacity: 0; }
  .view.active { display: block; animation: viewIn .5s ease-out forwards; }
  @keyframes viewIn { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }

  /* INPUTS */
  .input { width: 100%; background: rgba(15,23,42,.92); border: 1px solid rgba(51,65,85,.9); border-radius: .75rem; padding: .85rem 1rem; font-size: .9rem; color: #f8fafc; transition: all .3s; outline: none; }
  .input:focus { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56,189,248,.3); }

  /* TOASTS */
  .toast { opacity: 0; transform: scale(.8); transition: all .4s cubic-bezier(.175,.885,.32,1.275); }
  .toast.show { opacity: 1; transform: scale(1); }
  
  /* ESQUELETO DE CARREGAMENTO */
  .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 37%, rgba(255,255,255,0.05) 63%); background-size: 400% 100%; animation: skeleton-loading 1.4s ease infinite; border-radius: 4px; color: transparent !important; }
  @keyframes skeleton-loading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  /* BOTÃO GOOGLE */
  .btn-google {
    display: inline-flex; align-items: center; justify-content: center; gap: .75rem;
    width: 100%; padding: 1rem 1.25rem;
    background: rgba(15,23,42,.9); border: 1px solid rgba(56,189,248,.5); border-radius: 9999px;
    color: #f8fafc; font-size: .85rem; font-weight: 700;
    box-shadow: 0 8px 30px -8px rgba(56,189,248,.4); transition: all .2s; cursor: pointer;
  }
  .btn-google:hover { background: rgba(30,41,59,.9); transform: translateY(-2px); }
  .btn-google:active { transform: scale(.96); }
</style>
</head>
<body class="text-slate-100 min-h-screen pb-28 relative">

<canvas id="bg" aria-hidden="true"></canvas>
<div id="toasts" class="fixed top-20 left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-[9999] flex flex-col items-center gap-2 pointer-events-none"></div>

<!-- SPLASH SCREEN -->
<div id="welcome-splash" class="fixed inset-0 z-[100] bg-[#020617]/95 hidden flex-col items-center justify-center transition-all duration-500">
  <div class="w-32 h-32 rounded-full border-4 border-sky-400 overflow-hidden flex items-center justify-center bg-slate-800 shadow-[0_0_60px_rgba(56,189,248,.5)]">
    <img src="https://raw.githubusercontent.com/gilneilaurindo/planilhaviva/main/logo.png" class="w-16 h-16 object-contain" alt="Logo PlanilhaViva">
  </div>
  <h2 class="text-3xl font-black text-white mt-6">Finanças <span class="text-sky-400">Pessoais</span></h2>
  <p class="text-sky-200/70 text-xs mt-2 font-mono" id="splash-msg">A preparar o seu banco de dados...</p>
</div>

<main class="relative z-10 max-w-md mx-auto flex flex-col min-h-screen">
  
  <!-- TELA DE LOGIN -->
  <section id="view-auth" class="flex-1 flex flex-col justify-center px-6">
    <div class="glass glass-neon rounded-3xl p-8 text-center space-y-6 relative overflow-hidden">
      <div class="glow-blue"></div>
      
      <div class="inline-flex p-4 rounded-3xl bg-slate-900 border border-sky-400/50 shadow-[0_0_40px_rgba(56,189,248,.4)]">
        <img src="https://raw.githubusercontent.com/gilneilaurindo/planilhaviva/main/logo.png" alt="Logo" class="w-20 h-20 object-contain">
      </div>

      <div>
        <h1 class="text-3xl font-black tracking-tight text-white">O seu <span class="text-sky-400">Controle</span></h1>
        <p class="text-xs text-sky-100/70 mt-2 font-medium leading-relaxed">Faça a gestão financeira inteligente e automatizada.</p>
      </div>

      <div class="space-y-3 relative z-20">
        <button id="btnLogin" type="button" class="btn-google">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Acessar com o Google</span>
        </button>
      </div>
    </div>
  </section>

  <!-- APP DO CLIENTE -->
  <section id="view-app" class="hidden flex-1 flex-col w-full">
    <header class="sticky top-0 z-30 glass rounded-b-3xl px-5 py-4 flex items-center justify-between shadow-lg border-b border-sky-500/20">
      <div class="flex items-center gap-3">
        <div id="avatar" class="w-10 h-10 rounded-full border-2 border-sky-400 overflow-hidden flex items-center justify-center bg-slate-800">
          <i data-lucide="user" class="w-5 h-5 text-sky-400"></i>
        </div>
        <div>
          <span class="text-[9px] text-sky-400 font-black uppercase tracking-widest block mb-0.5">Bem-vindo(a)</span>
          <h2 class="text-xs font-bold text-white truncate w-32" id="user-name">Cliente</h2>
        </div>
      </div>
      <div class="flex gap-2">
        <a id="sheet-link" href="#" target="_blank" class="text-sky-400 bg-slate-800 p-2 rounded-full border border-slate-700 hover:text-white transition hidden">
          <i data-lucide="external-link" class="w-4 h-4"></i>
        </a>
        <button class="text-rose-400 bg-slate-800 p-2 rounded-full border border-slate-700 hover:text-white transition" onclick="App.logout()">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <div class="px-5 pt-6 space-y-6">
      <!-- DASHBOARD (RESUMO) -->
      <div id="view-dashboard" class="view active space-y-5">
        
        <!-- Saldo Principal -->
        <div class="glass p-6 rounded-3xl border border-sky-500/30 text-center relative overflow-hidden">
          <div class="absolute -top-10 -right-10 w-32 h-32 bg-sky-500/10 rounded-full blur-2xl"></div>
          <p class="text-[10px] uppercase tracking-widest text-sky-400 font-bold mb-2">Saldo Atual</p>
          <p class="text-3xl font-black text-white skeleton w-32 h-10 mx-auto" id="kpi-saldo">R$ 0,00</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="glass p-4 rounded-2xl border border-emerald-500/30">
            <p class="text-[9px] uppercase tracking-widest text-emerald-400 font-bold mb-1">Entradas</p>
            <p class="text-lg font-black text-white skeleton w-20 h-6 inline-block" id="kpi-entradas">R$ 0,00</p>
          </div>
          <div class="glass p-4 rounded-2xl border border-rose-500/30">
            <p class="text-[9px] uppercase tracking-widest text-rose-400 font-bold mb-1">Saídas</p>
            <p class="text-lg font-black text-white skeleton w-20 h-6 inline-block" id="kpi-saidas">R$ 0,00</p>
          </div>
        </div>

        <div class="glass rounded-2xl p-5 border border-sky-500/20">
          <h3 class="text-xs font-black uppercase text-sky-400 flex items-center gap-2 mb-4"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Fluxo Mensal</h3>
          <div class="w-full h-[180px] relative">
            <div id="chart-loader" class="absolute inset-0 flex items-center justify-center text-sky-500 text-xs font-bold animate-pulse">A atualizar dados...</div>
            <canvas id="chartFlow"></canvas>
          </div>
        </div>
      </div>

      <!-- LANÇAMENTO (NOVO REGISTRO) -->
      <div id="view-add" class="view space-y-5">
        <div class="glass rounded-2xl p-6 border border-sky-500/30 relative">
          <h3 class="text-xs font-black uppercase text-sky-400 flex items-center gap-2 mb-5"><i data-lucide="plus-circle" class="w-4 h-4"></i> Novo Lançamento</h3>
          
          <form class="space-y-4" onsubmit="event.preventDefault(); Client.addTransaction();">
            
            <div class="grid grid-cols-2 gap-3 mb-4">
              <label class="relative cursor-pointer">
                <input type="radio" name="type" value="out" class="peer sr-only" checked>
                <div class="p-3 text-center rounded-xl border border-slate-700 bg-slate-800/50 peer-checked:bg-rose-900/40 peer-checked:border-rose-500 peer-checked:text-rose-400 transition font-bold text-xs">
                  Despesa
                </div>
              </label>
              <label class="relative cursor-pointer">
                <input type="radio" name="type" value="in" class="peer sr-only">
                <div class="p-3 text-center rounded-xl border border-slate-700 bg-slate-800/50 peer-checked:bg-emerald-900/40 peer-checked:border-emerald-500 peer-checked:text-emerald-400 transition font-bold text-xs">
                  Receita
                </div>
              </label>
            </div>

            <div>
              <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Data</label>
              <input id="tx-date" type="date" class="input text-xs" required>
            </div>
            
            <div>
              <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Valor (R$)</label>
              <input id="tx-amount" type="number" step="0.01" class="input text-xs font-bold text-sky-400" placeholder="0,00" required>
            </div>

            <div>
              <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Descrição</label>
              <input id="tx-desc" type="text" class="input text-xs" placeholder="Ex: Supermercado" required>
            </div>

            <div>
              <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Categoria</label>
              <select id="tx-category" class="input text-xs">
                <option value="Alimentação">Alimentação</option>
                <option value="Moradia">Moradia</option>
                <option value="Transporte">Transporte</option>
                <option value="Saúde">Saúde</option>
                <option value="Lazer">Lazer</option>
                <option value="Investimento">Investimento</option>
                <option value="Salário/Receita">Salário/Receita</option>
                <option value="Outros">Outros</option>
              </select>
            </div>

            <button type="submit" class="w-full font-bold py-3.5 mt-2 rounded-xl flex justify-center items-center gap-2 transition bg-sky-500 hover:bg-sky-600 text-white shadow-[0_0_20px_rgba(56,189,248,.3)]" id="btn-save">
              <i data-lucide="check" class="w-4 h-4"></i> Registar Lançamento
            </button>
          </form>
        </div>
      </div>

    </div>
  </section>
</main>

<!-- NAVEGAÇÃO INFERIOR -->
<nav id="bottom-nav" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-md z-40">
  <div class="glass rounded-2xl relative grid grid-cols-2 p-1 shadow-2xl border border-slate-700">
    <span id="nav-pill" class="absolute top-1 bottom-1 left-1 rounded-xl bg-slate-800 border border-sky-500/50 w-[calc((100%-0.5rem)/2)] transition-transform duration-300 shadow-[0_0_15px_rgba(56,189,248,.2)]"></span>
    <button class="nav-btn relative z-10 flex flex-col items-center gap-1 py-3 text-white" data-view="dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[9px] font-bold uppercase">Resumo</span></button>
    <button class="nav-btn relative z-10 flex flex-col items-center gap-1 py-3 text-slate-400" data-view="add"><i data-lucide="plus-circle" class="w-5 h-5"></i><span class="text-[9px] font-bold uppercase">Lançar</span></button>
  </div>
</nav>

<script>
// ============================================================================
// CONFIGURAÇÕES GERAIS (As mesmas do Painel Admin)
// ============================================================================
const CONFIG = {
  GOOGLE_CLIENT_ID: "546894329579-fui2cv5rv322fus6qmqdd4ojusi1vidm.apps.googleusercontent.com",
  // 👇 AQUI ESTÁ O LINK UNIFICADO DO SUPER SERVIDOR:
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzCJfyUM7VH4tshO5z5vwHh31ufnlN5ORsqWl2oC1MiD1-CTP4Hh-nQFgdMCRMZQbkphw/exec"
};

const State = { user: null, tokenClient: null };
const $ = id => document.getElementById(id);
const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
let chartInstance = null;

// ============================================================================
// ANIMAÇÃO DE FUNDO (Partículas conectadas, tons de Azul/Sky)
// ============================================================================
function initParticles() {
  const canvas = $("bg"); 
  if(!canvas) return;
  const ctx = canvas.getContext("2d"); 
  let p = [];

  const rz = () => { 
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight; 
    p = Array.from({length: 40}, () => ({
      x: Math.random() * canvas.width, 
      y: Math.random() * canvas.height, 
      vx: (Math.random() - 0.5) * 0.5, 
      vy: (Math.random() - 0.5) * 0.5, 
      r: Math.random() * 2 + 1
    })); 
  };

  const an = () => { 
    ctx.clearRect(0, 0, canvas.width, canvas.height); 
    
    for(let i = 0; i < p.length; i++) {
      const pt = p[i];
      pt.x += pt.vx; 
      pt.y += pt.vy; 
      if(pt.x < 0 || pt.x > canvas.width) pt.vx *= -1; 
      if(pt.y < 0 || pt.y > canvas.height) pt.vy *= -1; 
      
      ctx.fillStyle = "rgba(56, 189, 248, 0.3)"; 
      ctx.beginPath(); 
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); 
      ctx.fill(); 

      for(let j = i + 1; j < p.length; j++) {
        const q = p[j];
        const dist = Math.hypot(pt.x - q.x, pt.y - q.y);
        if(dist < 100) {
          ctx.strokeStyle = `rgba(56, 189, 248, ${0.2 * (1 - dist / 100)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(pt.x, pt.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(an); 
  };
  window.addEventListener("resize", rz); rz(); an();
}

// ============================================================================
// UI & COMUNICAÇÃO COM O SERVIDOR
// ============================================================================
const UI = {
  toast: (msg, type = "success") => {
    const icon = type === "error" ? "alert-triangle" : "check-circle";
    const color = type === "error" ? "text-rose-400" : "text-emerald-400";
    const t = document.createElement("div"); 
    t.className = "toast glass rounded-2xl px-6 py-4 flex items-center justify-center gap-3 text-sm font-bold text-white z-[9999]";
    t.innerHTML = `<i data-lucide="${icon}" class="w-6 h-6 ${color}"></i><span>${msg}</span>`;
    $("toasts").append(t); 
    if(window.lucide) lucide.createIcons();
    requestAnimationFrame(() => t.classList.add("show"));
    setTimeout(() => { 
      t.classList.remove("show"); 
      setTimeout(() => t.remove(), 400); 
    }, 4000);
  }
};

const API = {
  call: async (action, payload = {}) => {
    if (!State.user) throw new Error("Usuário não autenticado.");
    try {
      const res = await fetch(CONFIG.SCRIPT_URL, {
        method: "POST", 
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, email: State.user.email, name: State.user.name, ...payload })
      });
      const json = await res.json();
      if (json.status !== "success") throw new Error(json.message || "Erro no Servidor.");
      return json;
    } catch(err) {
      throw new Error(err.message || "Erro de ligação com a base de dados.");
    }
  }
};

// ============================================================================
// LÓGICA DO CLIENTE (Dashboard e Transações)
// ============================================================================
const Client = {
  initializeUserDatabase: async () => {
    try {
      const res = await API.call("init_user");
      if(res.data && res.data.sheetUrl) {
        $("sheet-link").href = res.data.sheetUrl;
        $("sheet-link").classList.remove("hidden");
      }
      Client.syncData();
    } catch(e) {
      $("splash-msg").textContent = "Erro: " + e.message;
      $("splash-msg").classList.replace("text-sky-200/70", "text-rose-400");
    }
  },

  syncData: async () => {
    try {
      $("chart-loader").classList.remove("hidden");
      const res = await API.call("get_dashboard");
      const data = res.data;

      $("kpi-saldo").classList.remove("skeleton"); $("kpi-saldo").textContent = brl.format(data.saldoAtual || 0);
      $("kpi-entradas").classList.remove("skeleton"); $("kpi-entradas").textContent = brl.format(data.totalEntradas || 0);
      $("kpi-saidas").classList.remove("skeleton"); $("kpi-saidas").textContent = brl.format(data.totalSaidas || 0);

      $("chart-loader").classList.add("hidden");
      if(chartInstance) chartInstance.destroy();
      Chart.defaults.color = '#94a3b8';
      
      const labels = data.mensal.map(m => m.mes);
      const entradas = data.mensal.map(m => m.entradas);
      const saidas = data.mensal.map(m => m.saidas);

      chartInstance = new Chart($("chartFlow"), {
        type: 'bar',
        data: { 
          labels: labels, 
          datasets: [
            { label: 'Entradas', data: entradas, backgroundColor: '#10b981', borderRadius: 4 },
            { label: 'Saídas', data: saidas, backgroundColor: '#f43f5e', borderRadius: 4 }
          ] 
        },
        options: { 
          responsive: true, maintainAspectRatio: false, 
          scales: { y: { display: false }, x: { grid: { display: false } } },
          plugins: { legend: { display: false } } 
        }
      });
    } catch(e) { 
      $("chart-loader").textContent = "Não foi possível carregar os dados.";
      ["kpi-saldo", "kpi-entradas", "kpi-saidas"].forEach(id => {
         $(id).classList.remove("skeleton");
         $(id).textContent = "-";
      });
    }
  },

  addTransaction: async () => {
    const btn = $("btn-save");
    btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> A guardar...`;
    
    try {
      const payload = {
        date: $("tx-date").value,
        amount: Number($("tx-amount").value),
        desc: $("tx-desc").value,
        category: $("tx-category").value,
        type: document.querySelector('input[name="type"]:checked').value
      };

      await API.call("add_transaction", payload);
      UI.toast("Lançamento guardado com sucesso!", "success");
      
      // Limpar formulário e voltar ao dashboard
      $("tx-amount").value = ""; $("tx-desc").value = "";
      App.nav("dashboard");
      Client.syncData();

    } catch(e) { 
      UI.toast(e.message, "error"); 
    } finally { 
      btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Registar Lançamento`; 
      if(window.lucide) lucide.createIcons(); 
    }
  }
};

// ============================================================================
// AUTENTICAÇÃO
// ============================================================================
const App = {
  init: () => {
    initParticles(); 
    if(window.lucide) lucide.createIcons();
    
    $("tx-date").valueAsDate = new Date(); // Preenche data de hoje por defeito
    
    document.querySelectorAll(".nav-btn").forEach(b => {
      b.addEventListener("click", () => App.nav(b.dataset.view));
    });

    const savedUser = localStorage.getItem("planilhaviva_client_auth");
    if (savedUser) { 
      try {
        State.user = JSON.parse(savedUser); 
        App.startSession(); 
        return;
      } catch(err) {
        localStorage.removeItem("planilhaviva_client_auth");
      }
    }

    App.setupGoogleLogin();
  },

  setupGoogleLogin: (attempts = 0) => {
    if (window.google?.accounts?.oauth2) {
      State.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.GOOGLE_CLIENT_ID, 
        scope: "email profile",
        callback: async (t) => {
          if (t.error) return UI.toast("Falha na autenticação.", "error");
          try {
            const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers: { Authorization: `Bearer ${t.access_token}` } });
            const p = await res.json();
            State.user = { name: p.name, email: p.email, picture: p.picture };
            localStorage.setItem("planilhaviva_client_auth", JSON.stringify(State.user));
            App.startSession();
          } catch(err) { 
            UI.toast("Erro ao validar conta.", "error"); 
          }
        }
      });

      const btn = $("btnLogin");
      if (btn) {
        btn.onclick = () => {
          if (!State.tokenClient) return UI.toast("A carregar... tente de novo.", "error");
          State.tokenClient.requestAccessToken({ prompt: "select_account" });
        };
      }
      return;
    }
    if (attempts < 40) setTimeout(() => App.setupGoogleLogin(attempts + 1), 200);
  },

  startSession: () => {
    $("view-auth").classList.replace("flex", "hidden");
    const splash = $("welcome-splash");
    splash.classList.remove("hidden"); 
    splash.classList.add("flex");
    
    if(State.user.picture && $("avatar")) {
      $("avatar").innerHTML = `<img src="${State.user.picture}" class="w-full h-full object-cover">`;
    }
    $("user-name").textContent = State.user.name ? State.user.name.split(" ")[0] : "Cliente";
    
    // Chama o servidor para garantir que a planilha deste cliente existe
    Client.initializeUserDatabase();

    setTimeout(() => { 
      splash.classList.add("opacity-0"); 
      setTimeout(() => { 
        splash.classList.replace("flex", "hidden"); 
        $("view-app").classList.remove("hidden"); 
        $("view-app").classList.add("flex"); 
        $("bottom-nav").classList.remove("hidden"); 
        App.nav("dashboard"); 
      }, 500); 
    }, 1500);
  },

  logout: () => { 
    localStorage.removeItem("planilhaviva_client_auth"); 
    location.reload(); 
  },

  nav: (view) => {
    ["dashboard", "add"].forEach((v, i) => {
      const act = v === view;
      $("view-" + v).classList.toggle("active", act);
      $("view-" + v).classList.toggle("hidden", !act);
      const b = document.querySelector(`.nav-btn[data-view="${v}"]`);
      if(b) { 
        b.classList.toggle("text-white", act); 
        b.classList.toggle("text-slate-400", !act); 
        if (act) $("nav-pill").style.transform = `translateX(${i * 100}%)`; 
      }
    });
    window.scrollTo(0, 0); 
    if(window.lucide) lucide.createIcons();
  }
};

document.addEventListener("DOMContentLoaded", App.init);
</script>
</body>
</html>
